server:
  port: 8083

room-service:
  url: http://room-service:8082

moderation-service:
  url: http://moderation-service:8084

spring:
  data:
    mongodb:
      uri: mongodb://mongo:27017/LiveTalk

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-registry:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    enable:
      websocket: true
