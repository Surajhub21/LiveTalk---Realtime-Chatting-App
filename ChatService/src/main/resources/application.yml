room-service:
  url: http://localhost:8082
moderation-service:
  url: http://localhost:8084


server:
  port: 8083

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/LiveTalk
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  web:
    socket:
      stomp:
        broker:
          relay:
            enabled: true
            relay-host: localhost
            relay-port: 61613
            client-login: guest
            client-passcode: guest
            heartbeat:
              server: 60 * 60000    # Send heartbeat every 10 seconds
              client: 60 * 60000    # Expect heartbeat every 10 seconds

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    enable:
      websocket: true


eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true