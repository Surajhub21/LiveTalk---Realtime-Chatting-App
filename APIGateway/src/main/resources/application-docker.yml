server:
  port: 9090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: UserService
          uri: http://user-service:8081
          predicates:
            - Path=/users/**

        - id: ModerationService
          uri: http://moderation-service:8084
          predicates:
            - Path=/moderation/**

        - id: RoomService
          uri: http://room-service:8082
          predicates:
            - Path=/rooms/**

        - id: NotificationService
          uri: http://notification-service:8085
          predicates:
            - Path=/notification/**

        - id: ChatService
          uri: http://chat-service:8083
          predicates:
            - Path=/chat/**

        - id: PaymentGatewayService
          uri: http://payment-gateway-service:8083
          predicates:
            - Path=/payment/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka-registry:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"